          - 'null'
          format: date-time
        cancellationReason:
          type:
          - string
          - 'null'
    ContributionListResponse:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Contribution'
    DebtItem:
      type: object
      properties:
        feeId:
          type: string
        feeName:
          type: string
        month:
          $ref: '#/components/schemas/Month'
        amountDue:
          $ref: '#/components/schemas/Money'
        amountPaid:
          $ref: '#/components/schemas/Money'
        amountRemaining:
          $ref: '#/components/schemas/Money'
    HouseholdDebt:
      type: object
      properties:
        householdId:
          type: string
        apartmentCode:
          type: string
        headOfHouseholdName:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/DebtItem'
        totalRemaining:
          $ref: '#/components/schemas/Money'
    DebtListResponse:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - type: object
        required:
        - items
        properties:
          month:
            description: Kỳ được lọc bằng tham số `month`; null nếu truy vấn theo khoảng hoặc mọi kỳ.
            oneOf:
            - $ref: '#/components/schemas/Month'
            - type: 'null'
          fromMonth:
            oneOf:
            - $ref: '#/components/schemas/Month'
            - type: 'null'
          toMonth:
            oneOf:
            - $ref: '#/components/schemas/Month'
            - type: 'null'
          grandTotalRemaining:
            $ref: '#/components/schemas/Money'
          items:
            type: array
            items:
              $ref: '#/components/schemas/HouseholdDebt'
    HouseholdSearchResult:
      allOf:
      - $ref: '#/components/schemas/Household'
      - type: object
        required:
        - resultType
        properties:
          resultType:
            type: string
            const: HOUSEHOLD
    MemberSearchResult:
      allOf:
      - $ref: '#/components/schemas/Member'
      - type: object
        required:
        - resultType
        properties:
          resultType:
            type: string
            const: MEMBER
          apartmentCode:
            type: string
    SearchResponse:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              oneOf:
              - $ref: '#/components/schemas/HouseholdSearchResult'
              - $ref: '#/components/schemas/MemberSearchResult'
              discriminator:
                propertyName: resultType
                mapping:
                  HOUSEHOLD: '#/components/schemas/HouseholdSearchResult'
                  MEMBER: '#/components/schemas/MemberSearchResult'
    StatisticsResponse:
      type: object
      required:
      - periodType
      - from
      - to
      properties:
        periodType:
          type: string
          enum:
          - MONTH
          - QUARTER
          - YEAR
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totals:
          type: object
          properties:
            amountDue:
              $ref: '#/components/schemas/Money'
            amountCollected:
              $ref: '#/components/schemas/Money'
            amountRemaining:
              $ref: '#/components/schemas/Money'
            collectionRate:
              type: number
              minimum: 0
              maximum: 100
              description: Tỷ lệ thu, đơn vị phần trăm.
            householdsPaid:
              type: integer
              description: Số hộ đã nộp đủ mọi khoản của các kỳ trong khoảng thống kê.
            householdsTotal:
              type: integer
        byFee:
          type: array
          items:
            type: object
            properties:
              feeId:
                type: string
              feeName:
                type: string
              amountDue:
                $ref: '#/components/schemas/Money'
              amountCollected:
                $ref: '#/components/schemas/Money'
              amountRemaining:
                $ref: '#/components/schemas/Money'
              collectionRate:
                type: number
              householdsPaid:
                type: integer
        byCampaign:
          type: array
          items:
            type: object
            properties:
              campaignId:
                type: string
              campaignName:
                type: string
              totalAmount:
                $ref: '#/components/schemas/Money'
              householdsContributed:
                type: integer
        byPeriod:
          type: array
          description: Chuỗi thời gian theo `periodType` cho biểu đồ so sánh.
          items:
            type: object
            properties:
              period:
                type: string
                description: Nhãn kỳ, ví dụ 2026-11 (MONTH), 2026-Q4 (QUARTER), 2026 (YEAR).
                example: 2026-Q4
              amountDue:
                $ref: '#/components/schemas/Money'
              amountCollected:
                $ref: '#/components/schemas/Money'
