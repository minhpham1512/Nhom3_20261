        '403':
          $ref: '#/components/responses/Forbidden'
  /api/receipts/{receiptId}/print:
    parameters:
    - $ref: '#/components/parameters/ReceiptId'
    get:
      tags:
      - Receipts
      operationId: printReceipt
      summary: Lấy nội dung in phiếu thu
      description: |
        US20. Phiếu gồm số phiếu, mã căn hộ, người nộp, các khoản, tổng tiền
        bằng số và bằng chữ, người thu, ngày thu. Máy chủ đếm số lần in (`printCount` của phiếu):
        lần in đầu là bản gốc, các lần sau đánh dấu rõ "Bản sao". Lưu ý đây là GET có tác dụng phụ
        (tăng `printCount`), response phải có `Cache-Control: no-store`.
        Hỗ trợ HTML để trình duyệt in hoặc PDF theo cấu hình triển khai.
      x-user-stories:
      - US20
      x-roles:
      - ADMIN
      - ACCOUNTANT
      - BOARD_CHAIR
      parameters:
      - name: format
        in: query
        schema:
          type: string
          enum:
          - html
          - pdf
          default: html
      responses:
        '200':
          description: Nội dung phiếu thu để in.
          content:
            text/html:
              schema:
                type: string
              example: <html>...</html>
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/receipts/{receiptId}/cancel:
    parameters:
    - $ref: '#/components/parameters/ReceiptId'
    post:
      tags:
      - Receipts
      operationId: cancelReceipt
      summary: Hủy phiếu thu sai
      description: |
        US22. Bắt buộc cung cấp lý do hủy. Không xóa phiếu khỏi cơ sở dữ liệu;
        phiếu chuyển trạng thái CANCELLED và không được tính vào công nợ/thống kê.
        Hệ thống hoàn lại số tiền đã nộp trên từng khoản phải nộp liên quan (giảm `amountPaid`,
        tính lại `amountRemaining` và trạng thái UNPAID/PARTIALLY_PAID) trong cùng transaction.
        Thao tác hủy phải được ghi vào nhật ký.
      x-user-stories:
      - US22
      x-roles:
      - ACCOUNTANT
      - ADMIN
      x-priority: COULD HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Phiếu thu đã được hủy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Phiếu thu đã bị hủy trước đó (code RECEIPT_ALREADY_CANCELLED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/contributions:
    get:
      tags:
      - Contributions
      operationId: listContributions
      summary: Danh sách đóng góp tự nguyện
      description: US19. Tra cứu các khoản đóng góp theo đợt, hộ hoặc trạng thái; hộ không đóng góp không
        được coi là nợ.
      x-user-stories:
      - US19
      x-roles:
      - ADMIN
      - ACCOUNTANT
      - BOARD_CHAIR
      parameters:
      - name: campaignId
        in: query
        schema:
          type: string
      - name: householdId
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ContributionStatus'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Danh sách khoản đóng góp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContributionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Contributions
      operationId: createContribution
      summary: Ghi nhận đóng góp tự nguyện
      description: |
        US19. Số tiền phải lớn hơn 0. Đợt chưa bắt đầu (UPCOMING) không nhận đóng góp (409
        CAMPAIGN_NOT_STARTED). Nếu đợt đã kết thúc (CLOSED), hệ thống phải yêu cầu xác nhận rõ ràng
        trước khi ghi nhận: thiếu `confirmAfterEnd = true` trả 409 CAMPAIGN_CLOSED_CONFIRMATION_REQUIRED.
        Không tạo công nợ cho hộ không đóng góp.
      x-user-stories:
      - US19
      x-roles:
      - ACCOUNTANT
      - ADMIN
      x-priority: MUST HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContributionCreateRequest'
      responses:
        '201':
          description: Khoản đóng góp đã được ghi nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contribution'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Đợt chưa bắt đầu (CAMPAIGN_NOT_STARTED) hoặc đợt đã kết thúc và chưa có xác nhận
            (CAMPAIGN_CLOSED_CONFIRMATION_REQUIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/contributions/{contributionId}:
    parameters:
    - $ref: '#/components/parameters/ContributionId'
    get:
      tags:
      - Contributions
      operationId: getContribution
      summary: Xem chi tiết khoản đóng góp
      description: US19. Khoản đã hủy vẫn được giữ và trả về với trạng thái CANCELLED.
      x-user-stories:
      - US19
      x-roles:
      - ADMIN
      - ACCOUNTANT
      - BOARD_CHAIR
      responses:
        '200':
          description: Chi tiết khoản đóng góp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contribution'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/contributions/{contributionId}/cancel:
    parameters:
    - $ref: '#/components/parameters/ContributionId'
    post:
      tags:
      - Contributions
      operationId: cancelContribution
      summary: Hủy khoản đóng góp nhập sai
      description: |
        US19. Bắt buộc cung cấp lý do hủy. Không xóa khỏi cơ sở dữ liệu; khoản chuyển trạng thái
        CANCELLED và không được tính vào thống kê. Thao tác hủy phải được ghi vào nhật ký.
      x-user-stories:
      - US19
      x-roles:
      - ACCOUNTANT
      - ADMIN
      x-priority: COULD HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        '200':
          description: Khoản đóng góp đã được hủy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contribution'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Khoản đóng góp đã bị hủy trước đó (code CONTRIBUTION_ALREADY_CANCELLED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/debts:
    get:
      tags:
      - Debts
      operationId: listDebts
      summary: Theo dõi hộ chưa nộp hoặc nộp thiếu
      description: |
        US21. Trả số tiền còn nợ theo hộ và từng khoản, kèm tổng nợ từng hộ và tổng nợ toàn danh sách.
        Dùng `month` cho một kỳ hoặc `fromMonth`/`toMonth` cho một khoảng kỳ (không dùng đồng thời);
        bỏ trống cả hai để xem nợ tồn của mọi kỳ. Các khoản đóng góp tự nguyện tuyệt đối không xuất
        hiện trong danh sách công nợ; phiếu đã hủy không được tính.
      x-user-stories:
      - US21
      x-roles:
      - ADMIN
      - ACCOUNTANT
      - BOARD_CHAIR
      x-priority: SHOULD HAVE
      parameters:
      - name: month
        in: query
        description: Một kỳ thu cụ thể (YYYY-MM).
        schema:
          $ref: '#/components/schemas/Month'
      - name: fromMonth
        in: query
        schema:
          $ref: '#/components/schemas/Month'
      - name: toMonth
        in: query
        schema:
          $ref: '#/components/schemas/Month'
      - name: householdId
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Danh sách công nợ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DebtListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/search:
    get:
      tags:
      - Search
      operationId: searchHouseholdsAndMembers
      summary: Tìm kiếm hộ và nhân khẩu
      description: |
        US23. Tìm theo mã căn hộ, tên hoặc CCCD; hỗ trợ tìm một phần tên và
        tìm không dấu. Mục tiêu hiệu năng trong User Story là trả kết quả
        trong tối đa 2 giây với quy mô ước tính khoảng 2.000 nhân khẩu.
        Mỗi phần tử có `resultType` (HOUSEHOLD hoặc MEMBER) để phân biệt.
        Với vai trò ACCOUNTANT, kết quả nhân khẩu chỉ gồm thông tin định danh tối thiểu để tìm hộ
        thu phí và CCCD được che (chỉ hiện 4 số cuối).
      x-user-stories:
      - US23
      x-roles:
      - ADMIN
      - ACCOUNTANT
      - RESIDENT_MANAGER
      - BOARD_CHAIR
      x-priority: MUST HAVE
      parameters:
      - name: q
        in: query
        required: true
        description: Chuỗi tìm kiếm.
        schema:
          type: string
          minLength: 1
      - name: type
        in: query
        schema:
          type: string
          enum:
          - ALL
          - HOUSEHOLD
          - MEMBER
          default: ALL
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Kết quả tìm kiếm; mảng rỗng nếu không có kết quả.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/households/{householdId}/receipts:
    parameters:
    - $ref: '#/components/parameters/HouseholdId'
    get:
      tags:
      - Receipts
      operationId: listHouseholdReceiptHistory
      summary: Tra cứu lịch sử nộp phí của hộ
      description: |
        US24. Trả về phiếu thu theo thứ tự thời gian, gồm kỳ, khoản thu, số tiền
        và người thu. Hỗ trợ lọc theo năm hoặc khoản thu. Phiếu đã hủy vẫn hiển thị
        với nhãn trạng thái Đã hủy, không cộng vào số liệu thu hợp lệ.
      x-user-stories:
      - US24
      x-roles:
      - ADMIN
      - ACCOUNTANT
      - BOARD_CHAIR
      parameters:
      - name: year
        in: query
        schema:
          type: integer
          minimum: 2000
          maximum: 2100
      - name: feeId
        in: query
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Lịch sử nộp phí của hộ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/stats:
    get:
      tags:
      - Statistics
      operationId: getCollectionStatistics
      summary: Thống kê khoản thu và đóng góp
      description: |
        US25. `from`–`to` là khoảng thống kê (`from` không lớn hơn `to`); `periodType` (MONTH, QUARTER,
        YEAR) là độ chi tiết của chuỗi `byPeriod`. Các tổng `totals`/`byFee` tính theo kỳ phải nộp:
        gồm các kỳ có ngày đầu kỳ nằm trong [from, to] (nên chọn `from` là ngày đầu kỳ); số đã thu là tổng
        các dòng phiếu thu hợp lệ của những khoản phải nộp đó, bất kể ngày thu; phiếu đã hủy không được
        tính. `householdsPaid` là số hộ đã nộp đủ mọi khoản của các kỳ đó. Với đợt tự nguyện (`byCampaign`),
        tính theo ngày nhận đóng góp trong [from, to]: trả tổng tiền và số hộ đã đóng góp (khoản đã hủy
        không được tính).
      x-user-stories:
      - US25
      x-roles:
      - ADMIN
      - ACCOUNTANT
      - BOARD_CHAIR
      x-priority: MUST HAVE
      parameters:
      - name: periodType
        in: query
        required: true
        schema:
          type: string
          enum:
          - MONTH
          - QUARTER
          - YEAR
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: feeId
        in: query
        schema:
          type: string
      - name: campaignId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Dữ liệu tổng hợp thống kê.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/reports/fees:
    get:
      tags:
      - Fee Reports
      operationId: exportFeeReport
      summary: Xuất báo cáo thu phí
      description: |
        US26. Xuất báo cáo Excel hoặc PDF có cùng số liệu và cùng quy tắc tính với `/api/stats`.
        Báo cáo phải có tiêu đề, kỳ báo cáo, ngày lập và người lập.
      x-user-stories:
      - US26
      x-roles:
      - ADMIN
      - ACCOUNTANT
      - BOARD_CHAIR
      x-priority: SHOULD HAVE
      parameters:
      - name: format
        in: query
        required: true
        schema:
          type: string
          enum:
          - xlsx
          - pdf
      - name: periodType
        in: query
        required: true
        schema:
          type: string
          enum:
          - MONTH
          - QUARTER
          - YEAR
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: File báo cáo thu phí.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT accessToken được cấp sau khi đăng nhập thành công.
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema:
        type: string
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
    FeeId:
      name: feeId
      in: path
      required: true
      schema:
        type: string
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
    DueId:
      name: dueId
      in: path
      required: true
      schema:
        type: string
    ReceiptId:
      name: receiptId
      in: path
      required: true
      schema:
        type: string
    ContributionId:
      name: contributionId
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      description: Trang bắt đầu từ 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Unauthorized:
      description: Chưa xác thực, token không hợp lệ/hết hạn hoặc tài khoản đã bị vô hiệu hóa (code UNAUTHORIZED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Đã xác thực nhưng không có quyền thực hiện thao tác (code FORBIDDEN), hoặc tài khoản phải
        đổi mật khẩu tạm trước (code PASSWORD_CHANGE_REQUIRED).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy tài nguyên (code RESOURCE_NOT_FOUND).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Dữ liệu đầu vào không hợp lệ (code VALIDATION_ERROR).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: Mã lỗi ổn định, xem bảng mã lỗi ở phần mô tả API.
          example: RESOURCE_NOT_FOUND
        message:
          type: string
          example: Không tìm thấy dữ liệu yêu cầu.
        details:
          type: object
          additionalProperties: true
    ValidationError:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu đầu vào không hợp lệ.
        fields:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    Money:
      type: integer
      format: int64
      minimum: 0
      description: Số tiền VND, số nguyên (đồng).
      example: 350000
    Month:
      type: string
      pattern: ^\d{4}-(0[1-9]|1[0-2])$
      description: Kỳ thu theo định dạng YYYY-MM.
      example: '2026-11'
    IdentityNumber:
      type: string
      pattern: ^(\d{9}|\d{12})$
      description: CCCD 12 chữ số (hoặc CMND 9 chữ số). Cần BQT xác nhận có chấp nhận CMND cũ hay không.
    PageInfo:
      type: object
      required:
      - page
      - pageSize
      - total
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
          description: Tổng số bản ghi thỏa bộ lọc.
    UserRole:
      type: string
      enum:
      - ADMIN
      - ACCOUNTANT
      - RESIDENT_MANAGER
      - BOARD_CHAIR
      description: Admin, Kế toán, Cán bộ quản lý cư dân, Trưởng BQT.
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
      - LOCKED
      description: LOCKED do hệ thống tự đặt khi đăng nhập sai quá số lần cho phép.
    User:
      type: object
      required:
      - id
      - fullName
      - username
      - role
      - status
      - createdAt
      properties:
        id:
          type: string
        fullName:
          type: string
        username:
          type: string
        phone:
          type:
          - string
          - 'null'
        email:
          type:
          - string
          - 'null'
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        status:
          $ref: '#/components/schemas/UserStatus'
        mustChangePassword:
          type: boolean
          default: false
          description: true khi mật khẩu là mật khẩu tạm do Admin đặt; chỉ /api/me/password và /api/auth/logout
            dùng được cho đến khi đổi mật khẩu.
        createdAt:
          type: string
          format: date-time
    UserCreateRequest:
      type: object
      additionalProperties: false
      required:
      - fullName
      - username
      - password
      - role
      properties:
        fullName:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 3
        password:
          type: string
          format: password
          minLength: 8
          description: Phải có ít nhất một chữ cái và một chữ số.
        role:
          $ref: '#/components/schemas/UserRole'
        phone:
          type: string
        email:
          type: string
          format: email
    UserListResponse:
      allOf:
      - $ref: '#/components/schemas/PageInfo'
      - type: object
        required:
        - items
        properties:
          items:
