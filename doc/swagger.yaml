openapi: 3.1.0
info:
  title: BlueMoon Apartment Management API
  version: 1.0.0
  description: |
    Đặc tả API cho phần mềm quản lý cư dân và thu phí chung cư BlueMoon.

    ## Mã lỗi nghiệp vụ
    | HTTP | code | Khi nào |
    |------|------|---------|
    | 400 | VALIDATION_ERROR | Dữ liệu đầu vào sai định dạng hoặc vi phạm ràng buộc |
    | 400 | INVALID_CURRENT_PASSWORD | Mật khẩu hiện tại không đúng khi đổi mật khẩu |
    | 400 | AMOUNT_EXCEEDS_REMAINING | Số tiền thu lớn hơn số còn phải nộp của khoản |
    | 401 | UNAUTHORIZED | Chưa đăng nhập, token hết hạn hoặc tài khoản bị vô hiệu hóa |
    | 401 | INVALID_CREDENTIALS | Sai tên đăng nhập/mật khẩu (thông báo chung) |
    | 403 | FORBIDDEN | Không đủ quyền |
    | 403 | PASSWORD_CHANGE_REQUIRED | Tài khoản phải đổi mật khẩu tạm trước khi dùng chức năng khác |
    | 404 | RESOURCE_NOT_FOUND | Không tìm thấy tài nguyên |
    | 404 | NO_DATA_TO_EXPORT | Không có dữ liệu để xuất báo cáo |
    | 409 | USERNAME_EXISTS | Tên đăng nhập đã tồn tại |
    | 409 | LAST_ADMIN_PROTECTED | Không được hạ quyền hoặc vô hiệu hóa Admin cuối cùng |
    | 409 | SELF_MODIFICATION_NOT_ALLOWED | Không được tự đổi vai trò/trạng thái hoặc tự reset mật khẩu |
    | 409 | APARTMENT_OCCUPIED | Căn hộ đã có hộ đang ở |
    | 409 | DUPLICATE_IDENTITY_NUMBER | CCCD đã tồn tại |
    | 409 | HEAD_REPLACEMENT_REQUIRED | Chủ hộ rời hộ nhưng chưa chọn chủ hộ mới hợp lệ |
    | 409 | HOUSEHOLD_HAS_OUTSTANDING_DEBT | Hộ còn khoản chưa nộp nên không thể ngừng quản lý |
    | 409 | FEE_NAME_EXISTS | Tên khoản thu trùng với khoản đang hoạt động |
    | 409 | PRICE_WARNING_CONFIRMATION_REQUIRED | Đơn giá phí dịch vụ ngoài khung 2.500–16.500 VND/m², cần xác nhận |
    | 409 | NO_ACTIVE_FEE | Không có khoản thu bắt buộc đang hoạt động để lập kỳ |
    | 409 | DUE_ALREADY_PAID | Khoản phải nộp đã được thanh toán hết |
    | 409 | RECEIPT_ALREADY_CANCELLED | Phiếu thu đã bị hủy trước đó |
    | 409 | CONTRIBUTION_ALREADY_CANCELLED | Khoản đóng góp đã bị hủy trước đó |
    | 409 | CAMPAIGN_NOT_STARTED | Đợt đóng góp chưa bắt đầu |
    | 409 | CAMPAIGN_CLOSED_CONFIRMATION_REQUIRED | Đợt đã kết thúc, cần `confirmAfterEnd=true` |
    | 423 | ACCOUNT_LOCKED | Tài khoản đang bị khóa tạm thời |
  contact:
    name: Nhóm 3

tags:
- name: Authentication
  description: Đăng nhập, đăng xuất, làm mới phiên, thông tin cá nhân và đổi mật khẩu.
- name: Users
  description: Tạo tài khoản, quản lý vai trò, trạng thái và đặt lại mật khẩu.
- name: Audit Logs
  description: Nhật ký thao tác phục vụ truy vết.
- name: Households
  description: Quản lý hộ gia đình và căn hộ.
- name: Members
  description: Quản lý nhân khẩu, lịch sử biến động và tạm trú/tạm vắng.
- name: Resident Reports
  description: Xuất báo cáo hộ, nhân khẩu và tạm trú/tạm vắng.
- name: Imports
  description: Nhập dữ liệu hộ và nhân khẩu từ Excel.
- name: Fees
  description: Danh mục khoản thu bắt buộc và lịch sử đơn giá.
- name: Contribution Campaigns
  description: Các đợt đóng góp tự nguyện.
- name: Dues
  description: Lập và tra cứu danh sách khoản phải nộp.
- name: Receipts
  description: Ghi nhận thu phí, tra cứu và hủy phiếu thu.
- name: Contributions
  description: Ghi nhận, tra cứu và hủy đóng góp tự nguyện.
- name: Debts
  description: Theo dõi các khoản còn nợ hoặc nộp thiếu.
- name: Search
  description: Tìm kiếm hộ và nhân khẩu.
- name: Statistics
  description: Thống kê thu phí và đóng góp.
- name: Fee Reports
  description: Xuất báo cáo thu phí.

security:
- bearerAuth: []

paths:
  /api/auth/login:
    post:
      tags:
      - Authentication
      operationId: login
      summary: Đăng nhập
      description: |
        US02. Xác thực bằng tên đăng nhập và mật khẩu được cấp. Trả thông báo lỗi chung
        (INVALID_CREDENTIALS) khi thông tin không hợp lệ hoặc tài khoản đã bị vô hiệu hóa,
        không tiết lộ sai tên đăng nhập hay mật khẩu.
        Theo tiêu chí chấp nhận: khóa tài khoản 15 phút sau 5 lần đăng nhập sai liên tiếp (423);
        phiên hết hạn sau 30 phút không thao tác (accessToken ngắn hạn, refreshToken hạn trượt 30 phút).
      security: []
      x-user-stories:
      - US02
      x-priority: MUST HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Tên đăng nhập hoặc mật khẩu không hợp lệ (code INVALID_CREDENTIALS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          description: Tài khoản đang bị khóa tạm thời (code ACCOUNT_LOCKED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ACCOUNT_LOCKED
                message: Tài khoản đang bị khóa tạm thời. Vui lòng thử lại sau.
                details:
                  lockedUntil: '2026-11-12T09:45:00+07:00'
  /api/auth/refresh:
    post:
      tags:
      - Authentication
      operationId: refreshToken
      summary: Làm mới phiên đăng nhập
      description: |
        US02. Đổi refreshToken còn hiệu lực lấy accessToken mới. Mỗi lần làm mới sẽ cấp refreshToken
        mới (xoay vòng) và gia hạn cửa sổ 30 phút không thao tác; refreshToken cũ bị vô hiệu hóa.
        Từ chối (401) nếu refreshToken hết hạn, đã bị thu hồi hoặc tài khoản không còn ACTIVE.
      security: []
      x-user-stories:
      - US02
      x-priority: MUST HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Đã cấp token mới.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/logout:
    post:
      tags:
      - Authentication
      operationId: logout
      summary: Đăng xuất
      description: |
        US02. Thu hồi refreshToken được gửi lên; nếu không gửi body thì thu hồi refreshToken gắn
        với phiên hiện tại. accessToken hiện tại hết hiệu lực khi hết hạn ngắn của nó.
      x-user-stories:
      - US02
      x-priority: MUST HAVE
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Đăng xuất thành công.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/users:
    get:
      tags:
      - Users
      operationId: listUsers
      summary: Danh sách tài khoản
      description: US01, US05. Admin xem danh sách tài khoản thành viên BQT.
      x-user-stories:
      - US01
      - US05
      x-roles:
      - ADMIN
      x-priority: MUST HAVE
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/UserStatus'
      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/UserRole'
      responses:
        '200':
          description: Danh sách tài khoản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Users
      operationId: createUser
      summary: Tạo tài khoản thành viên BQT
      description: |
        US01. Chỉ Admin được tạo tài khoản. Tên đăng nhập phải duy nhất;
        mật khẩu tối thiểu 8 ký tự, có cả chữ và số. Mật khẩu phải được băm
        trước khi lưu, không trả mật khẩu hoặc giá trị hash trong response.
      x-user-stories:
      - US01
      x-roles:
      - ADMIN
      x-priority: MUST HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: Tài khoản được tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Tên đăng nhập đã tồn tại (code USERNAME_EXISTS).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users/{userId}:
    parameters:
    - $ref: '#/components/parameters/UserId'
    get:
      tags:
      - Users
      operationId: getUser
      summary: Xem chi tiết tài khoản
      description: US01, US05. Admin xem thông tin tài khoản theo ID.
      x-user-stories:
      - US01
      - US05
      x-roles:
      - ADMIN
      responses:
        '200':
          description: Thông tin tài khoản.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users/{userId}/role:
    parameters:
    - $ref: '#/components/parameters/UserId'
    patch:
      tags:
      - Users
      operationId: updateUserRole
      summary: Gán hoặc thay đổi vai trò tài khoản
      description: |
        US05. Vai trò mới được áp dụng khi người dùng đăng nhập lại; API phải kiểm tra quyền
        ở backend. Admin không được tự đổi vai trò của chính mình và không được hạ quyền
        Admin cuối cùng (409).
      x-user-stories:
      - US05
      x-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - role
              properties:
                role:
                  $ref: '#/components/schemas/UserRole'
      responses:
        '200':
          description: Vai trò đã được cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Tự đổi vai trò của mình hoặc hạ quyền Admin cuối cùng (code SELF_MODIFICATION_NOT_ALLOWED
            hoặc LAST_ADMIN_PROTECTED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users/{userId}/status:
    parameters:
    - $ref: '#/components/parameters/UserId'
    patch:
      tags:
      - Users
      operationId: updateUserStatus
      summary: Vô hiệu hóa hoặc kích hoạt tài khoản
      description: |
        US05. Chỉ nhận ACTIVE hoặc INACTIVE; trạng thái LOCKED do hệ thống tự đặt khi đăng nhập sai
        quá số lần cho phép. Đặt ACTIVE cho tài khoản đang LOCKED sẽ mở khóa ngay.
        Tài khoản bị vô hiệu hóa không thể đăng nhập, mọi refresh token bị thu hồi; lịch sử thao tác
        vẫn được giữ. Admin không được tự vô hiệu hóa mình và không được vô hiệu hóa Admin cuối cùng (409).
      x-user-stories:
      - US05
      x-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - ACTIVE
                  - INACTIVE
      responses:
        '200':
          description: Trạng thái tài khoản đã được cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Tự vô hiệu hóa mình hoặc vô hiệu hóa Admin cuối cùng (code SELF_MODIFICATION_NOT_ALLOWED
            hoặc LAST_ADMIN_PROTECTED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/users/{userId}/password-reset:
    parameters:
    - $ref: '#/components/parameters/UserId'
    post:
      tags:
      - Users
      operationId: resetUserPassword
      summary: Đặt lại mật khẩu cho tài khoản
      description: |
        US05. Admin tạo mật khẩu tạm cho tài khoản khác (trả về đúng một lần, không lưu dạng rõ).
        Mọi refresh token của tài khoản bị thu hồi và tài khoản phải đổi mật khẩu ở lần đăng nhập kế
        tiếp (`mustChangePassword = true`). Admin tự đổi mật khẩu của mình qua `/api/me/password`.
      x-user-stories:
      - US05
      x-roles:
      - ADMIN
      x-priority: COULD HAVE
      responses:
        '200':
          description: Đã đặt lại mật khẩu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Không thể tự đặt lại mật khẩu của chính mình qua API này (code SELF_MODIFICATION_NOT_ALLOWED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/me:
    get:
      tags:
      - Authentication
      operationId: getMyProfile
      summary: Xem thông tin cá nhân
      description: US04. Trả về họ tên, số điện thoại, email, vai trò và tên đăng nhập của tài khoản hiện
        tại.
      x-user-stories:
      - US04
      x-priority: SHOULD HAVE
      responses:
        '200':
          description: Hồ sơ tài khoản hiện tại.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - Authentication
      operationId: updateMyProfile
      summary: Cập nhật thông tin cá nhân
      description: |
        US04. Chỉ cho phép sửa họ tên, số điện thoại và email; không cho tự sửa tên đăng nhập
        hoặc vai trò (body chứa trường khác sẽ bị từ chối 400). Đây là thay thế toàn bộ ba trường:
        phone/email bỏ trống sẽ được xóa.
      x-user-stories:
      - US04
      x-priority: SHOULD HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        '200':
          description: Hồ sơ đã được cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/me/password:
    put:
      tags:
      - Authentication
      operationId: changeMyPassword
      summary: Đổi mật khẩu
      description: |
        US03. Yêu cầu mật khẩu hiện tại chính xác; mật khẩu mới phải hợp lệ và khớp với trường
        xác nhận. Sai mật khẩu hiện tại trả 400 với code INVALID_CURRENT_PASSWORD (không dùng 401
        để frontend không nhầm với hết phiên). Đổi thành công sẽ thu hồi các refresh token khác của tài khoản.
      x-user-stories:
      - US03
      x-priority: MUST HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Đổi mật khẩu thành công.
        '400':
          description: Dữ liệu không hợp lệ hoặc mật khẩu hiện tại không đúng (code INVALID_CURRENT_PASSWORD).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              examples:
                invalidCurrentPassword:
                  summary: Mật khẩu hiện tại không đúng
                  value:
                    code: INVALID_CURRENT_PASSWORD
                    message: Mật khẩu hiện tại không đúng.
                    fields:
                    - field: currentPassword
                      message: Mật khẩu hiện tại không đúng.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/audit-logs:
    get:
      tags:
      - Audit Logs
      operationId: listAuditLogs
      summary: Tra cứu nhật ký thao tác
      description: |
        US06. Trưởng BQT xem nhật ký theo người thao tác và khoảng thời gian.
        Nhật ký ghi nhận người dùng, thời gian, đối tượng, hành động và giá trị
        trước/sau khi thay đổi. Không cung cấp API sửa hoặc xóa nhật ký.
      x-user-stories:
      - US06
      x-roles:
      - BOARD_CHAIR
      x-priority: COULD HAVE
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: userId
        in: query
        schema:
          type: string
      - name: action
        in: query
        schema:
          $ref: '#/components/schemas/AuditAction'
      - name: entityType
        in: query
        schema:
          type: string
      - name: from
        in: query
        description: Thời điểm bắt đầu, bao gồm cả thời điểm này.
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Thời điểm kết thúc, bao gồm cả thời điểm này.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Danh sách nhật ký thao tác.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/households:
    get:
      tags:
      - Households
      operationId: listHouseholds
      summary: Danh sách hộ gia đình
      description: US07, US08, US23. Hỗ trợ phân trang và lọc/tìm theo mã căn hộ, thông tin hộ và trạng
        thái. Mặc định chỉ trả hộ đang ACTIVE.
      x-user-stories:
      - US07
      - US08
      - US23
      x-roles:
      - ADMIN
      - ACCOUNTANT
      - RESIDENT_MANAGER
      - BOARD_CHAIR
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: q
        in: query
        description: Từ khóa tìm kiếm; hỗ trợ một phần tên và không dấu.
        schema:
          type: string
      - name: apartmentCode
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - ALL
          default: ACTIVE
      responses:
        '200':
          description: Danh sách hộ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - Households
      operationId: createHousehold
      summary: Thêm hộ gia đình
      description: |
        US07. Mã căn hộ không được trùng với hộ đang ở; diện tích phải lớn hơn 0.
        Chủ hộ được tạo cùng hộ trong cùng transaction qua `headMember` (nhân khẩu có
        `isHouseholdHead = true`, quan hệ "Chủ hộ"). `headOfHouseholdName` trong response là
        dữ liệu suy ra từ chủ hộ. Mỗi căn hộ chỉ có một hộ đang ở.
      x-user-stories:
      - US07
      x-roles:
      - RESIDENT_MANAGER
      - ADMIN
      x-priority: MUST HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdCreateRequest'
      responses:
        '201':
          description: Hộ gia đình đã được tạo cùng chủ hộ.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdDetail'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Căn hộ đã có hộ đang ở (APARTMENT_OCCUPIED) hoặc CCCD chủ hộ đã tồn tại (DUPLICATE_IDENTITY_NUMBER).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/households/{householdId}:
    parameters:
    - $ref: '#/components/parameters/HouseholdId'
    get:
      tags:
      - Households
      operationId: getHousehold
      summary: Xem chi tiết hộ gia đình
      description: |
        US08. Trả về thông tin hộ kèm danh sách nhân khẩu trong hộ.
        Với vai trò ACCOUNTANT, mảng `members` bị lược bỏ để không lộ thông tin cá nhân (CCCD, ngày sinh);
        kế toán chỉ cần thông tin hộ và chủ hộ để thu phí.
      x-user-stories:
      - US08
      x-roles:
      - ADMIN
      - ACCOUNTANT
      - RESIDENT_MANAGER
      - BOARD_CHAIR
      responses:
        '200':
          description: Chi tiết hộ gia đình.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseholdDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Households
      operationId: updateHousehold
      summary: Cập nhật thông tin hộ
      description: |
        US08. Cập nhật một phần (chỉ các trường được gửi). Khi thay đổi diện tích, giá trị mới chỉ
        được dùng cho các kỳ phải nộp được lập sau thời điểm cập nhật; dữ liệu các kỳ đã lập phải
        được giữ nguyên. Không đổi chủ hộ ở đây: dùng sự kiện HOUSEHOLD_HEAD_CHANGED của nhân khẩu.
      x-user-stories:
      - US08
      x-roles:
      - RESIDENT_MANAGER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HouseholdUpdateRequest'
      responses:
        '200':
          description: Hộ đã được cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Household'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
      - Households
      operationId: deleteHousehold
      summary: Ngừng quản lý hộ gia đình
      description: |
        US08. Chỉ cho phép xóa/ngừng quản lý khi hộ không còn khoản phí chưa nộp.
        Không xóa nếu còn công nợ. Để bảo toàn lịch sử, triển khai dùng xóa mềm
        (chuyển status sang INACTIVE) thay vì xóa vật lý dữ liệu liên quan.
      x-user-stories:
      - US08
      x-roles:
      - RESIDENT_MANAGER
      - ADMIN
      responses:
        '204':
          description: Hộ đã được ngừng quản lý.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Hộ còn khoản phí chưa nộp nên không thể xóa/ngừng quản lý (code HOUSEHOLD_HAS_OUTSTANDING_DEBT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/households/{householdId}/members:
    parameters:
    - $ref: '#/components/parameters/HouseholdId'
    get:
      tags:
      - Members
      operationId: listHouseholdMembers
      summary: Danh sách nhân khẩu trong hộ
      description: US08, US09. Trả về các nhân khẩu thuộc hộ được chọn. Không phân trang vì số nhân
        khẩu mỗi hộ nhỏ.
      x-user-stories:
      - US08
      - US09
      x-roles:
      - ADMIN
      - RESIDENT_MANAGER
      - BOARD_CHAIR
      responses:
        '200':
          description: Danh sách nhân khẩu.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Members
      operationId: createHouseholdMember
      summary: Thêm nhân khẩu vào hộ
      description: |
        US09, US10. CCCD không được trùng. Cho phép người dưới 14 tuổi chưa có CCCD; từ 14 tuổi trở
        lên bắt buộc có CCCD (kiểm tra ở backend). Nhân khẩu thêm qua API này luôn không phải chủ hộ
        (chủ hộ được tạo cùng hộ); đổi chủ hộ qua sự kiện HOUSEHOLD_HEAD_CHANGED.
        Có thể kèm `registrationEvent` (NEW_BORN hoặc MOVED_IN) để tự ghi biến động tương ứng
        trong cùng transaction.
      x-user-stories:
      - US09
      - US10
      x-roles:
      - RESIDENT_MANAGER
      - ADMIN
      x-priority: MUST HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberCreateRequest'
      responses:
        '201':
          description: Nhân khẩu đã được thêm.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: CCCD đã tồn tại (code DUPLICATE_IDENTITY_NUMBER).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/members/{memberId}:
    parameters:
    - $ref: '#/components/parameters/MemberId'
    get:
      tags:
      - Members
      operationId: getMember
      summary: Xem chi tiết nhân khẩu
      description: US09, US10. Trả về thông tin nhân khẩu và trạng thái cư trú hiện tại.
      x-user-stories:
      - US09
      - US10
      x-roles:
      - ADMIN
      - RESIDENT_MANAGER
      - BOARD_CHAIR
      responses:
        '200':
          description: Chi tiết nhân khẩu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags:
      - Members
      operationId: updateMember
      summary: Cập nhật thông tin nhân khẩu
      description: |
        US09. Cập nhật các thông tin cá nhân và quan hệ với chủ hộ; không dùng thao tác xóa cứng để
        ghi nhận biến động cư trú. Không đổi cờ chủ hộ ở đây (tránh vi phạm quy tắc đúng một chủ hộ):
        dùng sự kiện HOUSEHOLD_HEAD_CHANGED.
      x-user-stories:
      - US09
      x-roles:
      - RESIDENT_MANAGER
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberUpdateRequest'
      responses:
        '200':
          description: Nhân khẩu đã được cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: CCCD bị trùng (code DUPLICATE_IDENTITY_NUMBER).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/members/{memberId}/events:
    parameters:
    - $ref: '#/components/parameters/MemberId'
    get:
      tags:
      - Members
      operationId: listMemberEvents
      summary: Xem lịch sử biến động nhân khẩu
      description: US10. Trả về lịch sử theo thứ tự thời gian, không xóa cứng nhân khẩu khi chuyển đi
        hoặc thay đổi trạng thái. Không phân trang vì số sự kiện mỗi nhân khẩu nhỏ.
      x-user-stories:
      - US10
      x-roles:
      - ADMIN
      - RESIDENT_MANAGER
      - BOARD_CHAIR
      responses:
        '200':
          description: Lịch sử biến động của nhân khẩu.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemberEvent'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Members
      operationId: createMemberEvent
      summary: Ghi nhận biến động nhân khẩu
      description: |
        US10. Áp dụng cho nhân khẩu đã có hồ sơ: MOVED_OUT (chuyển đi), DECEASED (qua đời),
        HOUSEHOLD_HEAD_CHANGED (đổi chủ hộ; `memberId` trong path là chủ hộ hiện tại).
        Biến động NEW_BORN và MOVED_IN của người chưa có hồ sơ được ghi qua `registrationEvent`
        khi thêm nhân khẩu (POST /api/households/{householdId}/members).
        Bản ghi phải có ngày biến động, loại biến động, ghi chú và người ghi nhận.
        Sự kiện cập nhật `status` của nhân khẩu (MOVED_OUT, DECEASED).
        Khi chủ hộ chuyển đi, qua đời hoặc đổi chủ hộ, bắt buộc `newHeadMemberId` là nhân khẩu đang
        RESIDING cùng hộ; thiếu hoặc không hợp lệ trả 409 HEAD_REPLACEMENT_REQUIRED.
      x-user-stories:
      - US10
      x-roles:
      - RESIDENT_MANAGER
      - ADMIN
      x-priority: SHOULD HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemberEventCreateRequest'
      responses:
        '201':
          description: Biến động đã được ghi nhận.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberEvent'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Thiếu chủ hộ mới hoặc chủ hộ mới không hợp lệ (HEAD_REPLACEMENT_REQUIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/residence-records:
    get:
      tags:
      - Members
      operationId: listResidenceRecords
      summary: Tra cứu tạm trú và tạm vắng
      description: |
        US11. Lọc theo loại bản ghi, hộ, nhân khẩu và trạng thái hiệu lực.
        Khi currentOnly=true, chỉ trả các bản ghi còn hiệu lực tại ngày hiện tại.
      x-user-stories:
      - US11
      x-roles:
      - ADMIN
      - RESIDENT_MANAGER
      - BOARD_CHAIR
      parameters:
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/ResidenceRecordType'
      - name: householdId
        in: query
        schema:
          type: string
      - name: memberId
        in: query
        schema:
          type: string
      - name: currentOnly
        in: query
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Danh sách bản ghi tạm trú/tạm vắng.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidenceRecordListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Members
      operationId: createResidenceRecord
      summary: Đăng ký tạm trú hoặc tạm vắng
      description: |
        US11. Ngày kết thúc không được nhỏ hơn ngày bắt đầu. Phải gửi đúng một trong hai: `memberId`
        (nhân khẩu đã có hồ sơ) hoặc `newPerson` (người tạm trú chưa có hồ sơ). TEMPORARY_ABSENCE chỉ
        dùng với `memberId`. Với `newPerson`, hệ thống tạo nhân khẩu mới gắn vào hộ với trạng thái
        TEMPORARILY_STAYING (không phải chủ hộ) và trả `memberId` trong bản ghi. Trạng thái nhân khẩu
        (TEMPORARILY_ABSENT/TEMPORARILY_STAYING) theo hiệu lực của bản ghi theo ngày. Trường thông tin
        bắt buộc của người tạm trú cần được đối chiếu với quy định cư trú trước khi chốt triển khai.
      x-user-stories:
      - US11
      x-roles:
      - RESIDENT_MANAGER
      - ADMIN
      x-priority: SHOULD HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidenceRecordCreateRequest'
      responses:
        '201':
          description: Bản ghi tạm trú/tạm vắng đã được tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResidenceRecord'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: CCCD của người tạm trú mới đã tồn tại (code DUPLICATE_IDENTITY_NUMBER).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/reports/residents:
    get:
      tags:
      - Resident Reports
      operationId: exportResidentReport
      summary: Xuất báo cáo hộ và nhân khẩu
      description: |
        US12. Xuất báo cáo Excel theo loại dữ liệu và thời điểm được chọn: HOUSEHOLDS và MEMBERS
        dùng `asOf`; RESIDENCE_RECORDS dùng `from`/`to`.
        Nếu không có dữ liệu, trả lỗi nghiệp vụ NO_DATA_TO_EXPORT thay vì tạo file rỗng.
        File phải có tiêu đề, ngày xuất và người xuất.
      x-user-stories:
      - US12
      x-roles:
      - BOARD_CHAIR
      - ADMIN
      x-priority: SHOULD HAVE
      parameters:
      - name: reportType
        in: query
        required: true
        schema:
          type: string
          enum:
          - HOUSEHOLDS
          - MEMBERS
          - RESIDENCE_RECORDS
      - name: asOf
        in: query
        description: Ngày chốt dữ liệu báo cáo (HOUSEHOLDS, MEMBERS).
        schema:
          type: string
          format: date
      - name: from
        in: query
        description: Ngày bắt đầu (RESIDENCE_RECORDS).
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: Ngày kết thúc (RESIDENCE_RECORDS); không nhỏ hơn `from`.
        schema:
          type: string
          format: date
      responses:
        '200':
          description: File báo cáo Excel.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          description: Không có dữ liệu phù hợp để xuất báo cáo (code NO_DATA_TO_EXPORT).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/imports/households-members:
    post:
      tags:
      - Imports
      operationId: importHouseholdsAndMembers
      summary: Nhập hộ và nhân khẩu từ Excel
      description: |
        US13. Nhận file Excel theo mẫu đã thống nhất. Dòng hợp lệ được nhập;
        dòng thiếu trường bắt buộc hoặc trùng CCCD bị bỏ qua và được trả về
        trong báo cáo lỗi kèm số dòng và lý do. Cần chốt file mẫu với BQT.
      x-user-stories:
      - US13
      x-roles:
      - RESIDENT_MANAGER
      - ADMIN
      x-priority: COULD HAVE
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File .xlsx theo mẫu nhập liệu BlueMoon.
                dryRun:
                  type: boolean
                  default: false
                  description: Nếu true, chỉ kiểm tra và trả báo cáo lỗi, không ghi dữ liệu.
      responses:
        '200':
          description: Kết quả kiểm tra hoặc nhập dữ liệu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/fees:
    get:
      tags:
      - Fees
      operationId: listFees
      summary: Danh sách khoản thu bắt buộc
      description: US14, US16. Tra cứu các khoản thu và trạng thái áp dụng.
      x-user-stories:
      - US14
      - US16
      x-roles:
      - ADMIN
      - ACCOUNTANT
      - BOARD_CHAIR
      parameters:
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/FeeStatus'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Danh sách khoản thu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Fees
      operationId: createFee
      summary: Tạo khoản thu bắt buộc
      description: |
        US14. Khoản thu bắt buộc được tính theo đơn giá/m²/tháng.
        Với phí dịch vụ (`category = SERVICE_FEE`), đơn giá ngoài khoảng 2.500–16.500 VND/m² phải
        phát cảnh báo và yêu cầu xác nhận: lần gọi đầu trả 409 PRICE_WARNING_CONFIRMATION_REQUIRED
        (kèm `details.minPrice`, `details.maxPrice`), gọi lại với `confirmPriceWarning = true` để lưu.
        Đây là cảnh báo nghiệp vụ, không mặc định từ chối lưu. Trùng tên với khoản đang hoạt động
        trả 409 FEE_NAME_EXISTS.
      x-user-stories:
      - US14
      x-roles:
      - ACCOUNTANT
      - ADMIN
      x-priority: MUST HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeeCreateRequest'
      responses:
        '201':
          description: Khoản thu đã được tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fee'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Tên khoản thu trùng (FEE_NAME_EXISTS) hoặc cần xác nhận đơn giá ngoài khung
            (PRICE_WARNING_CONFIRMATION_REQUIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                priceWarning:
                  summary: Đơn giá phí dịch vụ ngoài khung
                  value:
                    code: PRICE_WARNING_CONFIRMATION_REQUIRED
                    message: Đơn giá phí dịch vụ nằm ngoài khoảng 2.500–16.500 VND/m². Vui lòng xác nhận.
                    details:
                      minPrice: 2500
                      maxPrice: 16500
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/fees/{feeId}:
