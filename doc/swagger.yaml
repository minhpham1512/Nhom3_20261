    patch:
      tags:
      - Fees
      operationId: updateFee
      summary: Cập nhật đơn giá hoặc thông tin khoản thu
      description: |
        US16. Cập nhật một phần. Khi đổi đơn giá bắt buộc kèm `effectiveFrom` và hệ thống tạo mốc
        hiệu lực mới (xem lịch sử ở GET /api/fees/{feeId}/prices); các kỳ phải nộp đã lập không bị
        thay đổi. `effectiveFrom` nên là ngày đầu tháng và không được thuộc kỳ đã lập danh sách phải
        nộp (400). Đơn giá áp dụng cho một kỳ là mốc có `effectiveFrom` lớn nhất không vượt quá ngày
        đầu kỳ. Quy tắc cảnh báo khung giá phí dịch vụ giống khi tạo (409
        PRICE_WARNING_CONFIRMATION_REQUIRED, gửi lại với `confirmPriceWarning = true`).
        Khoản thu đã có phiếu thu không được xóa vật lý.
      x-user-stories:
      - US16
      x-roles:
      - ACCOUNTANT
      - ADMIN
      x-priority: SHOULD HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeeUpdateRequest'
      responses:
        '200':
          description: Khoản thu đã được cập nhật.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fee'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Tên khoản thu trùng (FEE_NAME_EXISTS) hoặc cần xác nhận đơn giá ngoài khung
            (PRICE_WARNING_CONFIRMATION_REQUIRED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
