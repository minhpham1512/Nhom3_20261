  /api/dues:
    get:
      tags:
      - Dues
      operationId: listDues
      summary: Tra cứu danh sách phải nộp
      description: |
        US17, US18. Lọc theo kỳ, hộ và trạng thái khoản phải nộp. Dùng `month` cho một kỳ hoặc
        `fromMonth`/`toMonth` cho một khoảng kỳ (không dùng đồng thời); bỏ trống cả hai để xem mọi kỳ.
        `outstandingOnly=true` chỉ trả khoản còn phải nộp (UNPAID và PARTIALLY_PAID), tiện cho
        màn hình thu phí để liệt kê nợ tồn nhiều kỳ của một hộ.
      x-user-stories:
      - US17
      - US18
      x-roles:
      - ADMIN
      - ACCOUNTANT
      - BOARD_CHAIR
      parameters:
      - name: month
        in: query
        description: Một kỳ thu cụ thể (YYYY-MM).
        schema:
          $ref: '#/components/schemas/Month'
      - name: fromMonth
        in: query
        schema:
          $ref: '#/components/schemas/Month'
      - name: toMonth
        in: query
        schema:
          $ref: '#/components/schemas/Month'
      - name: householdId
        in: query
        schema:
          type: string
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/DueStatus'
      - name: outstandingOnly
        in: query
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Danh sách khoản phải nộp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DueListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Dues
      operationId: generateMonthlyDues
      summary: Lập danh sách phải nộp theo tháng
      description: |
        US17. Tạo khoản phải nộp cho mỗi hộ ACTIVE (đã chuyển đến trước hoặc trong kỳ) và mỗi khoản
        thu bắt buộc đang hoạt động. Số tiền = làm tròn half-up (đơn giá/m² × diện tích hộ) về đồng
        nguyên; đơn giá là mốc hiệu lực của kỳ, diện tích là giá trị tại thời điểm lập (cả hai được lưu
        kèm khoản phải nộp). Ràng buộc duy nhất theo hộ + khoản thu + kỳ nên thao tác idempotent:
        gọi lại cho cùng kỳ chỉ tạo các khoản còn thiếu (ví dụ hộ chuyển đến sau lần lập trước) và
        đếm các khoản đã có vào `skippedCount`; không trả lỗi trùng. Quy tắc mặc định trong User Story
        là hộ chuyển đến giữa tháng tính đủ tháng; cần được BQT xác nhận trước khi áp dụng chính thức.
        Trả 409 NO_ACTIVE_FEE nếu không có khoản thu bắt buộc nào đang hoạt động.
      x-user-stories:
      - US17
      x-roles:
      - ACCOUNTANT
      - ADMIN
      x-priority: MUST HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - month
              properties:
                month:
                  $ref: '#/components/schemas/Month'
                dueDate:
                  type: string
                  format: date
                  description: Hạn nộp chung nếu BQT cấu hình.
      responses:
        '200':
          description: Kỳ đã được lập đầy đủ trước đó; không có khoản mới (`createdCount = 0`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateDuesResponse'
        '201':
          description: Đã lập danh sách phải nộp (có ít nhất một khoản mới).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateDuesResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Không có khoản thu bắt buộc đang hoạt động (code NO_ACTIVE_FEE).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/dues/{dueId}:
    parameters:
    - $ref: '#/components/parameters/DueId'
    get:
      tags:
      - Dues
      operationId: getDue
      summary: Xem chi tiết khoản phải nộp
      description: US17, US18. Trả về số tiền phải nộp, đã nộp, còn lại và trạng thái.
      x-user-stories:
      - US17
      - US18
      x-roles:
      - ADMIN
      - ACCOUNTANT
      - BOARD_CHAIR
      responses:
        '200':
          description: Chi tiết khoản phải nộp.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Due'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/dues/notifications:
    post:
      tags:
      - Dues
      operationId: createDueNotifications
      summary: Tạo thông báo các khoản phải nộp
      description: US17. Tạo dữ liệu thông báo theo hộ, gồm kỳ, các khoản, số tiền và hạn nộp để hiển
        thị hoặc in/xuất.
      x-user-stories:
      - US17
      x-roles:
      - ACCOUNTANT
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - month
              properties:
                month:
                  $ref: '#/components/schemas/Month'
                householdIds:
                  type: array
                  items:
                    type: string
                  description: Bỏ trống để tạo thông báo cho tất cả hộ trong kỳ.
      responses:
        '200':
          description: Kết quả tạo thông báo.
          content:
            application/json:
              schema:
                type: object
                required:
                - month
                - generatedCount
                - items
                properties:
                  month:
                    $ref: '#/components/schemas/Month'
                  generatedCount:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DueNotification'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/receipts:
    get:
      tags:
      - Receipts
      operationId: listReceipts
      summary: Danh sách phiếu thu
      description: US18, US20, US24. Tra cứu phiếu thu theo hộ, kỳ, trạng thái hoặc người thu.
      x-user-stories:
      - US18
      - US20
      - US24
      x-roles:
      - ADMIN
      - ACCOUNTANT
      - BOARD_CHAIR
      parameters:
      - name: householdId
        in: query
        schema:
          type: string
      - name: month
        in: query
        schema:
          $ref: '#/components/schemas/Month'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/ReceiptStatus'
      - name: collectedBy
        in: query
        description: ID người dùng đã thu.
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Danh sách phiếu thu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptListResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Receipts
      operationId: createReceipt
      summary: Ghi nhận thu phí và tạo phiếu thu
      description: |
        US18. Cho phép thu một hoặc nhiều khoản trong cùng lần giao dịch. Mỗi lần thu tạo một số
        phiếu duy nhất, lưu ngày thu và người thu (lấy từ tài khoản đăng nhập).
        Ràng buộc: số tiền mỗi dòng lớn hơn 0 và không vượt số còn phải nộp (400 AMOUNT_EXCEEDS_REMAINING);
        mỗi `dueId` chỉ xuất hiện một lần và phải thuộc `householdId` (400); khoản đã thanh toán hết
        trả 409 DUE_ALREADY_PAID. `paidAt` mặc định là thời điểm hiện tại, không được ở tương lai; cho phép
        ghi bổ sung ngày thu trong quá khứ (được ghi nhật ký).
        Có thể nộp thiếu, khi đó khoản phải nộp chuyển trạng thái PARTIALLY_PAID và còn lại số tiền
        chưa thu. Tạo phiếu và cập nhật khoản phải nộp trong cùng transaction.
      x-user-stories:
      - US18
      x-roles:
      - ACCOUNTANT
      - ADMIN
      x-priority: MUST HAVE
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptCreateRequest'
      responses:
        '201':
          description: Phiếu thu được tạo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Khoản phải nộp đã được thanh toán hết (code DUE_ALREADY_PAID).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/receipts/{receiptId}:
    parameters:
    - $ref: '#/components/parameters/ReceiptId'
    get:
      tags:
      - Receipts
      operationId: getReceipt
      summary: Xem chi tiết phiếu thu
      description: US18, US20, US22. Phiếu đã hủy vẫn được giữ và trả về với trạng thái CANCELLED.
